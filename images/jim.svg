<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Jim: a cartoon shark holding a dumbbell in each fin, drawn for this project -->
  <defs>
    <!-- body outline, reused to keep the sweatband inside the head -->
    <clipPath id="body-clip">
      <path d="M100 30 C140 30 155 80 152 130 C150 165 130 182 100 182 C70 182 50 165 48 130 C45 80 60 30 100 30 Z"/>
    </clipPath>
  </defs>

  <!-- shadow -->
  <ellipse cx="100" cy="190" rx="62" ry="7" fill="#000" opacity="0.12"/>

  <!-- dorsal fin on top of the head (drawn first so it sits behind the body) -->
  <path d="M86 40 L106 4 L116 42 Z" fill="#4a6a87"/>

  <!-- tail fin at the bottom -->
  <path d="M100 174 L76 197 Q100 186 124 197 Z" fill="#4a6a87"/>

  <!-- body -->
  <path d="M100 30 C140 30 155 80 152 130 C150 165 130 182 100 182 C70 182 50 165 48 130 C45 80 60 30 100 30 Z" fill="#5b7c99"/>
  <!-- white belly -->
  <ellipse cx="100" cy="138" rx="33" ry="40" fill="#eef3f6"/>

  <!-- red gym sweatband -->
  <rect x="40" y="46" width="120" height="11" fill="#d64545" clip-path="url(#body-clip)"/>

  <!-- eyes -->
  <circle cx="82" cy="73" r="9" fill="#fff"/>
  <circle cx="118" cy="73" r="9" fill="#fff"/>
  <circle cx="84" cy="74" r="4.5" fill="#1d2630"/>
  <circle cx="116" cy="74" r="4.5" fill="#1d2630"/>
  <circle cx="85.5" cy="72.5" r="1.5" fill="#fff"/>
  <circle cx="117.5" cy="72.5" r="1.5" fill="#fff"/>
  <!-- determined eyebrows -->
  <path d="M72 62 L90 66" stroke="#1d2630" stroke-width="3" stroke-linecap="round"/>
  <path d="M128 62 L110 66" stroke="#1d2630" stroke-width="3" stroke-linecap="round"/>

  <!-- big toothy grin -->
  <path d="M72 94 Q100 122 128 94 Z" fill="#7a2e2e"/>
  <path d="M73 94 L78 102 L83 96 L88 104 L93 97 L100 106 L107 97 L112 104 L117 96 L122 102 L127 94 Z" fill="#fff"/>

  <!-- gills -->
  <path d="M60 98 Q64 105 60 112" stroke="#3e5a73" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M65 100 Q69 107 65 114" stroke="#3e5a73" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M140 98 Q136 105 140 112" stroke="#3e5a73" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M135 100 Q131 107 135 114" stroke="#3e5a73" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- left dumbbell -->
  <rect x="19" y="80" width="6" height="38" fill="#777"/>
  <rect x="11" y="72" width="22" height="11" rx="2" fill="#333"/>
  <rect x="11" y="115" width="22" height="11" rx="2" fill="#333"/>
  <!-- left fin (arm) gripping the dumbbell -->
  <path d="M56 112 Q36 106 18 96 Q20 104 28 104 Q42 112 54 132 Z" fill="#4a6a87"/>

  <!-- right dumbbell -->
  <rect x="175" y="80" width="6" height="38" fill="#777"/>
  <rect x="167" y="72" width="22" height="11" rx="2" fill="#333"/>
  <rect x="167" y="115" width="22" height="11" rx="2" fill="#333"/>
  <!-- right fin (arm) gripping the dumbbell -->
  <path d="M144 112 Q164 106 182 96 Q180 104 172 104 Q158 112 146 132 Z" fill="#4a6a87"/>
</svg>
