<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Davey the cat: a grey tabby, drawn for this project -->
  <ellipse cx="100" cy="185" rx="60" ry="8" fill="#000" opacity="0.12"/>
  <!-- tail with darker tabby rings -->
  <path d="M150 160 C190 150 190 100 165 95" stroke="#8b8682" stroke-width="14" fill="none" stroke-linecap="round"/>
  <path d="M150 160 C190 150 190 100 165 95" stroke="#55504c" stroke-width="14" fill="none" stroke-dasharray="7 9"/>
  <!-- body -->
  <ellipse cx="100" cy="145" rx="55" ry="42" fill="#8b8682"/>
  <ellipse cx="100" cy="155" rx="30" ry="25" fill="#aaa5a0"/>
  <!-- body stripes -->
  <path d="M52 130 Q60 140 56 155 M60 120 Q70 132 66 148 M148 130 Q140 140 144 155 M140 120 Q130 132 134 148" stroke="#5f5a56" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- ears -->
  <polygon points="52,60 62,15 92,45" fill="#8b8682"/>
  <polygon points="148,60 138,15 108,45" fill="#8b8682"/>
  <polygon points="60,52 65,28 82,45" fill="#d9b8b3"/>
  <polygon points="140,52 135,28 118,45" fill="#d9b8b3"/>
  <!-- head -->
  <circle cx="100" cy="75" r="50" fill="#8b8682"/>
  <!-- light tan-grey forehead patch with dark tabby "M" stripes -->
  <ellipse cx="100" cy="42" rx="22" ry="14" fill="#a39b92"/>
  <path d="M85 30 L90 47 M100 27 L100 45 M115 30 L110 47" stroke="#4f4a46" stroke-width="5" stroke-linecap="round"/>
  <!-- dark stripes on the cheeks -->
  <path d="M55 72 Q62 76 66 74 M56 82 Q63 84 67 82 M145 72 Q138 76 134 74 M144 82 Q137 84 133 82" stroke="#4f4a46" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <!-- pale rings around the eyes -->
  <ellipse cx="80" cy="72" rx="11" ry="14" fill="#e8e4df"/>
  <ellipse cx="120" cy="72" rx="11" ry="14" fill="#e8e4df"/>
  <!-- green eyes -->
  <ellipse cx="80" cy="72" rx="8" ry="11" fill="#8a9a74"/>
  <ellipse cx="120" cy="72" rx="8" ry="11" fill="#8a9a74"/>
  <ellipse cx="80" cy="73" rx="3" ry="7" fill="#2b2b2b"/>
  <ellipse cx="120" cy="73" rx="3" ry="7" fill="#2b2b2b"/>
  <circle cx="82" cy="68" r="2.5" fill="#fff"/>
  <circle cx="122" cy="68" r="2.5" fill="#fff"/>
  <!-- tan-grey nose bridge -->
  <path d="M93 66 L107 66 L104 88 L96 88 Z" fill="#a39b92"/>
  <!-- white muzzle and chin -->
  <ellipse cx="92" cy="97" rx="11" ry="8" fill="#f3f0ec"/>
  <ellipse cx="108" cy="97" rx="11" ry="8" fill="#f3f0ec"/>
  <ellipse cx="100" cy="106" rx="11" ry="7" fill="#f3f0ec"/>
  <!-- pink nose and mouth -->
  <polygon points="94,87 106,87 100,94" fill="#d8928c"/>
  <path d="M100 94 Q93 102 88 97 M100 94 Q107 102 112 97" stroke="#3a3633" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- white whiskers (thin dark outline so they show on the light page too) -->
  <path d="M70 92 L38 86 M70 97 L38 100 M130 92 L162 86 M130 97 L162 100" stroke="#6e6965" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M70 92 L38 86 M70 97 L38 100 M130 92 L162 86 M130 97 L162 100" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round"/>
</svg>
